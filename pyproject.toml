[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-auth"
version = "0.5.5"
description = "Minimal OpenID Provider with passkey login for Python web apps"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Mikolaj" }]
dependencies = [
  "webauthn>=3,<4",
  "typing-extensions>=4.12",
]

[project.optional-dependencies]
fastapi = [
  "authlib>=1.8.0",
  "fastapi>=0.141.1",
  "joserfc>=1.7.5",
]
fastapi-htmx = ["app-factory[fastapi]>=0.6.22", "fastapi>=0.141.1", "jinja2>=3.1"]
oidc = [
  "authlib>=1.8.0",
  "fastapi>=0.141.1",
  "joserfc>=1.7.5",
]
dev = [
  "app-factory[fastapi]>=0.6.22",
  "authlib>=1.8.0",
  "basedpyright>=1.21",
  "fastapi>=0.141.1",
  "httpx2>=2.12.0",
  "jinja2>=3.1",
  "joserfc>=1.7.5",
  "pytest>=8",
  "ruff>=0.8",
]
browser = [
  "playwright>=1.62",
]

[tool.uv.sources]
app-factory = { git = "https://github.com/mikolaj92/app-factory", tag = "v0.6.22" }

[dependency-groups]
dev = [
  "app-factory[fastapi]>=0.6.22",
  "authlib>=1.8.0",
  "basedpyright>=1.21",
  "fastapi>=0.141.1",
  "httpx2>=2.12.0",
  "jinja2>=3.1",
  "joserfc>=1.7.5",
  "pytest>=8",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/my_auth"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
